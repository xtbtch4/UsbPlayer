name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Persistent signing key
        run: base64 -d app/signing.b64 > app/app.p12

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Build errors
        if: failure()
        shell: bash
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E '^e: |error:|What went wrong|Execution failed' -A3 build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: UsbPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
