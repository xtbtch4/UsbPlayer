name: Apply update

# Распаковывает загруженный в корень репозитория архив UsbPlayer-update.zip, коммитит файлы в main
# и запускает Android CI. Файлы в .github/workflows этим способом не меняются.
on: workflow_dispatch

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Распаковать архив
        run: |
          if [ ! -f UsbPlayer-update.zip ]; then
            echo "::error::Файл UsbPlayer-update.zip не найден в корне репозитория. Загрузите его: Add file -> Upload files."
            exit 1
          fi
          unzip -o UsbPlayer-update.zip
          rm UsbPlayer-update.zip
          rm -f app/src/main/java/com/example/usbplayer/DirectTee.kt

      - name: Закоммитить и запустить сборку
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Update UsbPlayer sources" || echo "Изменений нет"
          git push
          gh workflow run android.yml --ref "${{ github.ref_name }}"
