name: Apply update

# Разовая загрузка всех файлов проекта одним запуском: распаковывает исходники в репозиторий,
# коммитит их в main и запускает Android CI. Файлы в .github/workflows этим способом не меняются
# (GitHub не разрешает это встроенному токену).
