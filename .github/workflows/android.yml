name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # В проекте нет gradle wrapper, поэтому ставим Gradle напрямую (AGP 8.5 требует 8.7+)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # Если сборка упала, показываем только строки с ошибками прямо на странице запуска (Summary)
      - name: Ошибки сборки
        if: failure()
        shell: bash
        run: |
          {
            echo '## Ошибки сборки'
            echo '```'
            grep -E '^e: |error:|What went wrong|Execution failed' -A3 build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: UsbPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
