name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: yes | sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # В проекте нет gradle wrapper, поэтому ставим Gradle напрямую (AGP 8.5 требует 8.7+)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Постоянный ключ подписи (чтобы обновления ставились поверх)
        run: base64 -d app/signing.b64 > app/app.p12

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # Если сборка упала, показываем только строки с ошибками прямо на странице запуска (Summary)
      - name: Ошибки сборки
        if: failure()
        shell: bash
        run: |
          {
            echo '## Ошибки сборки'
            echo '```'
            grep -E '^e: |error:|What went wrong|Execution failed' -A3 build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: UsbPlayer-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
